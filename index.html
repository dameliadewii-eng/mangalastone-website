<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/img/logo4.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- MAIN TITLE -->
    <title>MANGALA STONE INDONESIA</title>

    <!-- SUBTITLE (Google will show this under the title) -->
    <meta
      name="description"
      content="MANGALA STONE INDONESIA — Premium supplier & exporter of Indonesian natural stone including Andesite, Basalt, Palem Sandstone, and Wall Cladding. Exporting worldwide with reliable quality."
    />

    <!-- SEO + SOCIAL -->
    <meta property="og:title" content="MANGALA STONE INDONESIA" />
    <meta
      property="og:description"
      content="Premium natural stone manufacturer & exporter from Indonesia: Andesite, Basalt, Palem Sandstone, Wall Cladding, and more."
    />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Global Styles -->
    <style>
      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #333;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
